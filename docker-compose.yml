services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nfpl_access
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - nfpl_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nfpl_access"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  nfpl_pgdata:
